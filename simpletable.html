<!DOCTYPE html>
<html>
<head>
  <title>Table Example</title>
  <style>
    table {
      width: 60%;
      border-collapse: collapse;
      margin: 20px auto;
    }
    th, td {
      border: 1px solid #333;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">HTML Table Example</h1>

  <table>
    <tr>
      <th>Roll No</th>
      <th>Name</th>
      <th>Marks</th>
    </tr>
    <tr>
      <td>1</td>
      <td>Rajan</td>
      <td>85</td>
    </tr>
    <tr>
      <td>2</td>
      <td>Sita</td>
      <td>90</td>
    </tr>
    <tr>
      <td>3</td>
      <td>Hari</td>
      <td>78</td>
    </tr>
  </table>
</body>
</html>
