<!DOCTYPE html>
<html>
<head>
    <title>Magic Table</title>
    <style>
        table {
            width: 400px;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>

<body>

<table>
    <tr>
        <th colspan="4">Magic Table</th>
    </tr>

    <tr>
        <td rowspan="2">8</td>
        <td colspan="2">7</td>
        <td rowspan="2">80</td>
    </tr>

    <tr>
        <td>20</td>
        <td>40</td>
    </tr>

    <tr>
        <td colspan="2">25</td>
        <td colspan="2">50</td>
    </tr>

    <tr>
        <td>60</td>
        <td colspan="2">90</td>
        <td>30</td>
    </tr>

</table>

</body>
</html>
