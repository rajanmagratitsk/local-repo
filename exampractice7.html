<!DOCTYPE html>
<html>
<head>
  <title>Rowspan and Colspan Example</title>
  <style>
    table {
      width: 70%;
      border-collapse: collapse;
      margin: 20px auto;
    }
    th, td {
      border: 1px solid #333;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Routine Table (Rowspan & Colspan)</h1>

  <table>
    <tr>
      <th colspan="4">Class Routine</th> <!-- Header spanning 4 columns -->
    </tr>
    <tr>
      <th>Day</th>
      <th>9–10 AM</th>
      <th>10–11 AM</th>
      <th>11–12 AM</th>
    </tr>
    <tr>
      <td rowspan="2">Sunday</td> <!-- Cell spanning 2 rows -->
      <td>Math</td>
      <td>English</td>
      <td>Science</td>
    </tr>
    <tr>
      <td colspan="2">Computer Lab</td> <!-- Cell spanning 2 columns -->
      <td>History</td>
    </tr>
    <tr>
      <td>Monday</td>
      <td>Physics</td>
      <td>Math</td>
      <td>Sports</td>
    </tr>
  </table>
</body>
</html>
