<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS Example</title>
</head>
<body style="font-family: Arial; background-color: #f9f9f9;">

    <h1 style="color: darkblue; text-align: center;">Welcome to My Page</h1>

    <p style="color: #333; font-size: 18px; line-height: 1.5;">
        This is a simple paragraph styled with inline CSS. 
        Notice how the <span style="color: red; font-weight: bold;">word here</span> 
        looks different because of inline styling.
    </p>

    <div style="border: 2px solid #555; padding: 15px; margin: 20px; background-color: #e0f7fa;">
        <h2 style="color: green;">Content Box</h2>
        <p style="font-size: 16px;">This box has its own background, padding, and border.</p>
    </div>

    <button style="background-color: orange; color: white; padding: 10px 20px; border: none; cursor: pointer;">
        Click Me
    </button>

</body>
</html>
