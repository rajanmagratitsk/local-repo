<!DOCTYPE html>
<html>
<head>
    <title>Internal Marks Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
    </style>
</head>
<body>

<h2>Internal Marks Evaluation</h2>

<table>
    <tr>
        <th rowspan="2">SN</th>
        <th rowspan="2">TU Reg No.</th>
        <th rowspan="2">Student Name</th>
        <th colspan="4">Internal Marks Evaluations</th>
    </tr>
    <tr>
        <th>Presentation (5)</th>
        <th>Attendance (5)</th>
        <th>MidTerm Exam (5)</th>
        <th>Pre-Board Exam (5)</th>
    </tr>

    <tr>
        <td>1</td>
        <td>12345</td>
        <td>Rajan</td>
        <td>4</td>
        <td>5</td>
        <td>3</td>
        <td>4</td>
    </tr>

    <tr>
        <td>2</td>
        <td>67890</td>
        <td>Ram</td>
        <td>5</td>
        <td>4</td>
        <td>4</td>
        <td>5</td>
    </tr>

</table>

</body>
</html>
