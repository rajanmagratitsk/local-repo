<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Table and Division Example</title>

<style>
    body {
        font-family: Arial;
    }

    /* Table Styling */
    table {
        border-collapse: collapse;
        width: 60%;
        margin: 20px auto;
    }

    th, td {
        border: 1px solid black;
        padding: 10px;
        text-align: center;
    }

    th {
        background-color: lightblue;
    }

    /* Division Styling */
    .container {
        width: 60%;
        margin: 20px auto;
        padding: 20px;
        border: 2px solid black;
        background-color: lightgray;
    }
</style>
</head>

<body>

<h2 style="text-align:center;">Table Example</h2>

<table>
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Course</th>
    </tr>
    <tr>
        <td>Rajan</td>
        <td>21</td>
        <td>BCA</td>
    </tr>
    <tr>
        <td>Ram</td>
        <td>22</td>
        <td>BBA</td>
    </tr>
</table>

<h2 style="text-align:center;">Division (Div) Example</h2>

<div class="container">
    <h3>About Me</h3>
    <p>This is a division block used to group content together.</p>
    <p>You can style it using CSS.</p>
</div>

</body>
</html>
