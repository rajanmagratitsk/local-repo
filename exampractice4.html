<!DOCTYPE html>
<html>
<head>
    <title>Wireframe Layout</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .logo, .navigation, .header, .footer {
            text-align: center;
            padding: 20px;
            border: 1px solid #333;
        }
        .logo { background-color: #f2f2f2; }
        .navigation { background-color: #d9edf7; }
        .header { background-color: #dff0d8; }
        .footer { background-color: #f5f5f5; }

        .main {
            display: flex;
        }
        .sidebar {
            width: 25%;
            border: 1px solid #333;
            padding: 20px;
            background-color: #fcf8e3;
        }
        .body {
            width: 75%;
            border: 1px solid #333;
            padding: 20px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="logo">Logo</div>
    <div class="navigation">Navigation</div>
    <div class="header">Header Banner</div>

    <div class="main">
        <div class="sidebar">Side Bar</div>
        <div class="body">Body Area</div>
    </div>

    <div class="footer">Footer</div>
</body>
</html>
